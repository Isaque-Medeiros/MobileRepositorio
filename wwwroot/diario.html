<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSFM - Diário Nutricional IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #000000; --bg-card: #1a1a1a; --text: #f1f5f9; --text-secondary: #94a3b8; --border: rgba(51,65,85,0.6); }
        .light-mode { --bg: #f8fafc; --bg-card: rgba(255,255,255,0.9); --text: #1e293b; --text-secondary: #64748b; --border: rgba(226,232,240,0.8); }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); transition: all 0.3s; }
        .glass-card { background: var(--bg-card); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 1.5rem; padding: 1.5rem; transition: all 0.3s; }
        .glass-card:hover { transform: translateY(-2px); box-shadow: 0 16px 40px -10px rgba(16,185,129,0.12); }
        .tab-diario { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .theme-btn { width: 44px; height: 44px; min-width: 44px; min-height: 44px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.25s ease; }
        .theme-btn:hover { transform: translateY(-2px); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #a7f3d0; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="p-3 rounded-xl transition" style="background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border);">
                    <i class="fas fa-chevron-left"></i>
                </a>
                <h1 class="text-2xl font-bold" style="color: var(--text);">Meu <span class="text-emerald-500">Diário IA</span></h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleTheme()" class="theme-btn"><i id="themeIcon" class="fas fa-sun"></i></button>
                <div class="text-right">
                    <p class="text-[10px] uppercase font-bold tracking-widest" style="color: var(--text-secondary);">Resumo 48h</p>
                    <div id="countRegistros" class="text-emerald-500 font-bold">0 refeições</div>
                </div>
            </div>
        </div>

        <!-- Alerta de Limpeza -->
        <div class="rounded-2xl p-4 mb-6 flex gap-3 items-center" style="background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3);">
            <i class="fas fa-history" style="color: #f59e0b;"></i>
            <p class="text-xs" style="color: #f59e0b;">Registros são mantidos por <strong>2 dias</strong> para priorizar seu foco nos objetivos recentes.</p>
        </div>

        <!-- Lista de Cards -->
        <div id="listaDiario" class="space-y-4">
            <div class="text-center py-20">
                <i class="fas fa-circle-notch animate-spin text-3xl text-emerald-500"></i>
            </div>
        </div>
    </div>

    <!-- ====== MODAL SALVAR NOS PLANOS ====== -->
    <div id="modalPlano" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4" style="background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);">
        <div class="w-full max-w-md rounded-3xl p-6 md:p-8 shadow-2xl" style="background: var(--bg-card); border: 1px solid var(--border);">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold" style="color: var(--text);">
                    <i class="fas fa-calendar-plus text-emerald-500 mr-2"></i>
                    Adicionar aos Planos
                </h3>
                <button onclick="fecharModalPlano()" class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: var(--bg); color: var(--text-secondary);">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <input type="hidden" id="planoAnaliseId">
            
            <div class="space-y-4">
                <!-- Nome do Prato -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-2" style="color: var(--text-secondary);">Nome do Prato</label>
                    <input id="planoNomePrato" type="text" 
                           class="w-full px-4 py-3 rounded-2xl font-medium outline-none transition"
                           style="background: var(--bg); color: var(--text); border: 1px solid var(--border);"
                           placeholder="Ex: Arroz com frango">
                </div>

                <!-- Ingredientes -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-2" style="color: var(--text-secondary);">Ingredientes</label>
                    <textarea id="planoIngredientes" rows="3"
                              class="w-full px-4 py-3 rounded-2xl font-medium outline-none transition resize-none"
                              style="background: var(--bg); color: var(--text); border: 1px solid var(--border);"
                              placeholder="Liste os ingredientes..."></textarea>
                </div>

                <!-- Dia da Semana -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-2" style="color: var(--text-secondary);">Dia da Semana</label>
                    <select id="planoDiaSemana" 
                            class="w-full px-4 py-3 rounded-2xl font-medium outline-none transition"
                            style="background: var(--bg); color: var(--text); border: 1px solid var(--border);">
                        <option value="Segunda">Segunda-feira</option>
                        <option value="Terca">Terça-feira</option>
                        <option value="Quarta">Quarta-feira</option>
                        <option value="Quinta">Quinta-feira</option>
                        <option value="Sexta">Sexta-feira</option>
                        <option value="Sabado">Sábado</option>
                        <option value="Domingo">Domingo</option>
                    </select>
                </div>

                <!-- Tipo de Refeição -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-2" style="color: var(--text-secondary);">Tipo de Refeição</label>
                    <select id="planoTipoRefeicao" 
                            class="w-full px-4 py-3 rounded-2xl font-medium outline-none transition"
                            style="background: var(--bg); color: var(--text); border: 1px solid var(--border);">
                        <option value="Café da Manhã">Café da Manhã</option>
                        <option value="Almoço">Almoço</option>
                        <option value="Jantar">Jantar</option>
                        <option value="Lanche">Lanche</option>
                    </select>
                </div>

                <!-- Macros (readonly) -->
                <div class="grid grid-cols-3 gap-3 p-4 rounded-2xl" style="background: var(--bg);">
                    <div class="text-center">
                        <p class="text-[9px] font-bold uppercase" style="color: var(--text-secondary);">Calorias</p>
                        <p id="planoCalorias" class="font-bold text-emerald-500">0</p>
                    </div>
                    <div class="text-center">
                        <p class="text-[9px] font-bold uppercase" style="color: var(--text-secondary);">Proteínas</p>
                        <p id="planoProteinas" class="font-bold text-rose-500">0g</p>
                    </div>
                    <div class="text-center">
                        <p class="text-[9px] font-bold uppercase" style="color: var(--text-secondary);">Carbos</p>
                        <p id="planoCarbos" class="font-bold text-blue-500">0g</p>
                    </div>
                </div>
            </div>

            <!-- Botões -->
            <div class="flex gap-3 mt-6">
                <button onclick="fecharModalPlano()" 
                        class="flex-1 py-3 rounded-2xl font-bold transition"
                        style="background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border);">
                    Cancelar
                </button>
                <button onclick="salvarPratoNosPlanos()" 
                        class="flex-1 py-3 rounded-2xl font-bold text-white transition-all"
                        style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 12px rgba(16,185,129,0.3);">
                    <i class="fas fa-check mr-1"></i> Salvar
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://bsfm-back-end.onrender.com';
        const userData = JSON.parse(localStorage.getItem('usuarioLogado'));

        // ====== TEMA ======
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const icon = document.getElementById('themeIcon');
            if (document.body.classList.contains('light-mode')) {
                icon.className = 'fas fa-moon';
                localStorage.setItem('bsfmTheme', 'light');
            } else {
                icon.className = 'fas fa-sun';
                localStorage.setItem('bsfmTheme', 'dark');
            }
        }
        if (localStorage.getItem('bsfmTheme') !== 'light') {
            document.body.classList.remove('light-mode');
            document.getElementById('themeIcon').className = 'fas fa-sun';
        } else {
            document.body.classList.add('light-mode');
            document.getElementById('themeIcon').className = 'fas fa-moon';
        }

        async function carregarDiario() {
            if(!userData) { window.location.href = 'login.html'; return; }

            try {
                const response = await fetch(`${API_URL}/historico-analises/${userData.id}`);
                const dados = await response.ok ? await response.json() : [];
                
                const container = document.getElementById('listaDiario');
                const contador = document.getElementById('countRegistros');
                
                if (dados.length === 0) {
                    container.innerHTML = `
                        <div class="glass-card p-10 text-center border-dashed">
                            <i class="fas fa-utensils text-5xl mb-4" style="color: var(--text-secondary); opacity: 0.3;"></i>
                            <p class="font-medium" style="color: var(--text-secondary);">Nenhuma análise feita nas últimas 48h.</p>
                            <a href="analisador-ia.html" class="inline-block mt-4 text-emerald-500 font-bold hover:underline">Analisar prato agora →</a>
                        </div>
                    `;
                    return;
                }

                contador.innerText = `${dados.length} registros`;
                container.innerHTML = '';

                dados.forEach(item => {
                    const dataFormatada = new Date(item.dataAnalise).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
                    const diaSemana = new Date(item.dataAnalise).toLocaleDateString('pt-BR', {weekday: 'long'});
                    const feedback = gerarFeedback(item, userData.gasto);

                    const card = `
                        <div class="glass-card">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <span class="text-[10px] font-bold uppercase" style="color: var(--text-secondary);">${diaSemana} • ${dataFormatada}</span>
                                    <h3 class="text-lg font-bold capitalize" style="color: var(--text);">${item.alimento}</h3>
                                    <p class="text-xs" style="color: var(--text-secondary);">Porção ${item.porcao}</p>
                                </div>
                                <div class="px-3 py-1.5 rounded-xl font-bold text-sm" style="background: #1a1a1a; color: white;">
                                    ${item.calorias} <span class="text-[9px]" style="color: #94a3b8;">kcal</span>
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-3 mb-5">
                                <div class="rounded-2xl p-3" style="background: rgba(59,130,246,0.1);">
                                    <p class="text-[9px] font-bold uppercase" style="color: #3b82f6;">Carbos</p>
                                    <p class="font-bold" style="color: #3b82f6;">${item.carbos}g</p>
                                </div>
                                <div class="rounded-2xl p-3" style="background: rgba(244,63,94,0.1);">
                                    <p class="text-[9px] font-bold uppercase" style="color: #f43f5e;">Proteínas</p>
                                    <p class="font-bold" style="color: #f43f5e;">${item.proteinas}g</p>
                                </div>
                                <div class="rounded-2xl p-3" style="background: rgba(245,158,11,0.1);">
                                    <p class="text-[9px] font-bold uppercase" style="color: #f59e0b;">Gorduras</p>
                                    <p class="font-bold" style="color: #f59e0b;">${item.gorduras}g</p>
                                </div>
                            </div>

                            <div class="rounded-2xl p-4 flex gap-3 items-start" style="background: ${feedback.corFundo}; border: 1px solid ${feedback.corBorda};">
                                <div class="text-lg mt-0.5">${feedback.emoji}</div>
                                <div>
                                    <p class="text-[10px] font-black uppercase tracking-tighter" style="color: ${feedback.corTexto};">Feedback da IA</p>
                                    <p class="text-xs leading-relaxed" style="color: ${feedback.corTexto}; opacity: 0.9;">${feedback.texto}</p>
                                </div>
                            </div>

                            <!-- Botão Salvar nos Planos -->
                            <button onclick="abrirModalPlano('${item.id}', '${item.alimento.replace(/'/g, "\\'")}', ${item.calorias}, ${item.proteinas}, ${item.carbos}, ${item.gorduras})" 
                                    class="mt-4 w-full py-3 rounded-2xl font-bold text-sm transition-all duration-200 flex items-center justify-center gap-2"
                                    style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; box-shadow: 0 4px 12px rgba(16,185,129,0.3);">
                                <i class="fas fa-calendar-plus"></i>
                                Salvar em Meus Planos
                            </button>
                        </div>
                    `;
                    container.innerHTML += card;
                });

            } catch (err) {
                console.error(err);
                document.getElementById('listaDiario').innerHTML = '<p class="text-center text-red-500">Erro ao carregar diário.</p>';
            }
        }

        function gerarFeedback(analise, gastoDiario) {
            const limiteRefeicao = (gastoDiario * 0.35);
            
            if (analise.calorias > limiteRefeicao) {
                return {
                    texto: "Esta refeição representa uma grande parte da sua meta diária. Balanceie com um jantar leve para não exceder seu gasto total.",
                    emoji: "⚖️",
                    corFundo: "rgba(251,146,60,0.1)",
                    corTexto: "#ea580c",
                    corBorda: "rgba(251,146,60,0.3)"
                };
            }
            
            if (analise.proteinas > 20) {
                return {
                    texto: "Excelente aporte de proteínas detectado! Isso é fundamental para manter sua massa magra e dar saciedade.",
                    emoji: "💪",
                    corFundo: "rgba(16,185,129,0.1)",
                    corTexto: "#059669",
                    corBorda: "rgba(16,185,129,0.3)"
                };
            }

            if (analise.alimento.toLowerCase().includes("brocolis") || analise.alimento.toLowerCase().includes("cenoura")) {
                 return {
                    texto: "Vegetais detectados. Você está fornecendo micronutrientes essenciais que ajudam no seu metabolismo celular.",
                    emoji: "🥦",
                    corFundo: "rgba(34,197,94,0.1)",
                    corTexto: "#16a34a",
                    corBorda: "rgba(34,197,94,0.3)"
                };
            }

            return {
                texto: "Análise realizada com sucesso. Mantenha-se hidratado e continue monitorando seus pratos para educar seu paladar.",
                emoji: "🎯",
                corFundo: "rgba(59,130,246,0.1)",
                corTexto: "#2563eb",
                corBorda: "rgba(59,130,246,0.3)"
            };
        }

        // ====== MODAL SALVAR NOS PLANOS ======
        function abrirModalPlano(id, nomePrato, calorias, proteinas, carbos, gorduras) {
            document.getElementById('planoAnaliseId').value = id;
            document.getElementById('planoNomePrato').value = nomePrato;
            document.getElementById('planoIngredientes').value = '';
            document.getElementById('planoCalorias').innerText = Math.round(calorias);
            document.getElementById('planoProteinas').innerText = Math.round(proteinas) + 'g';
            document.getElementById('planoCarbos').innerText = Math.round(carbos) + 'g';
            document.getElementById('modalPlano').classList.remove('hidden');
        }

        function fecharModalPlano() {
            document.getElementById('modalPlano').classList.add('hidden');
        }

        async function salvarPratoNosPlanos() {
            const nomePrato = document.getElementById('planoNomePrato').value.trim();
            const ingredientes = document.getElementById('planoIngredientes').value.trim();
            const diaSemana = document.getElementById('planoDiaSemana').value;
            const tipoRefeicao = document.getElementById('planoTipoRefeicao').value;
            const calorias = parseInt(document.getElementById('planoCalorias').innerText) || 0;
            const proteinas = parseFloat(document.getElementById('planoProteinas').innerText) || 0;
            const carbos = parseFloat(document.getElementById('planoCarbos').innerText) || 0;

            if (!nomePrato) {
                alert('Por favor, informe o nome do prato.');
                return;
            }

            const payload = {
                usuarioId: userData.id,
                diaSemana: diaSemana,
                tipoRefeicao: tipoRefeicao,
                nomePrato: nomePrato,
                ingredientes: ingredientes || nomePrato,
                modoPreparo: '',
                calorias: calorias,
                proteinas: proteinas,
                carboidratos: carbos,
                gorduras: 0,
                dataCriacao: new Date().toISOString()
            };

            try {
                const response = await fetch(`${API_URL}/salvar-refeicao-semana`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('✅ Prato salvo em seus planos com sucesso!');
                    fecharModalPlano();
                } else {
                    const err = await response.json();
                    alert('Erro ao salvar: ' + (err.mensagem || 'Tente novamente.'));
                }
            } catch (err) {
                console.error(err);
                alert('Erro de conexão com o servidor.');
            }
        }

        window.onload = carregarDiario;
    </script>
</body>
</html>
