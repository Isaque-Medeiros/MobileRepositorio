name: Keep Alive Render

on:
  schedule:
    # Roda a cada 10 minutos (vários horários para garantir)
    - cron: '*/10 * * * *'
    - cron: '*/10 * * * *' # Duplicado propositalmente para aumentar chance
  workflow_dispatch: # Permite rodar manualmente
  push:
    branches: [ main ] # Reativa o schedule ao fazer push

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "🔄 Ping enviado em $(date)"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://bsfm-back-end.onrender.com/)
          echo "✅ Resposta HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Backend acordado com sucesso!"
          else
            echo "⚠️ Resposta inesperada: $HTTP_CODE"
          fi
