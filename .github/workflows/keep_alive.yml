name: Keep Alive Render

on:
  schedule:
    # Roda a cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch: # <-- Isso permite que você rode a Action manualmente clicando em um botão

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: curl -s https://bsfm-back-end.onrender.com/